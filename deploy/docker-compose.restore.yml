services:
  restore-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${RESTORE_POSTGRES_USER:-calmboard_restore}
      POSTGRES_PASSWORD: ${RESTORE_POSTGRES_PASSWORD:-local-restore-only-change-me}
      POSTGRES_DB: ${RESTORE_POSTGRES_DB:-calmboard_restore}
    ports:
      - "127.0.0.1:${RESTORE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - restore_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  restore-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${RESTORE_MINIO_USER:-calmboard_restore}
      MINIO_ROOT_PASSWORD: ${RESTORE_MINIO_PASSWORD:-local-restore-only-change-me}
    command: server /data
    ports:
      - "127.0.0.1:${RESTORE_MINIO_PORT:-19000}:9000"
    volumes:
      - restore_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  restore_pgdata:
  restore_miniodata:
