global:
  resolve_timeout: 5m

route:
  receiver: calmboard-webhook
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: calmboard-webhook
    webhook_configs:
      - url: https://alerts.example.com/prometheus
        send_resolved: true
