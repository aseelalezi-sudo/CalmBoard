version: 2

updates:
  # pnpm workspace (root, apps/*, packages/*). Dependabot reads pnpm-lock.yaml through the npm ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    # Major versions change APIs and often need coordinated upgrades (for example NestJS packages, ioredis and the
    # Redis queue code), so they are handled by hand. Security advisories are still raised through Dependabot alerts.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Related packages must move together (fastify/NestJS, Next/React, TipTap, tooling), so group them.
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies]

  - package-ecosystem: docker
    directories:
      - /apps/web
      - /apps/api
      - /apps/worker
      - /docker/minio
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies]
    # The services run on Node 22 and CI tests Node 22. Do not jump base images to a newer major (for example the
    # non-LTS Node 25); move to the next LTS deliberately, in one change that also updates engines and CI.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
