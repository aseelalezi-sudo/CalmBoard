# CalmBoard local infrastructure stack.
# Production deployments must provide real secrets through the target platform.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:4000}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.1}
        NEXT_PUBLIC_TELEMETRY_UI_ENABLED: ${NEXT_PUBLIC_TELEMETRY_UI_ENABLED:-false}
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_URL=${APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calmboard_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-calmboard}:${POSTGRES_PASSWORD:-dev_postgres_password}@postgres:5432/${POSTGRES_DB:-calmboard_db}
      - DATABASE_APP_URL=postgresql://${POSTGRES_USER:-calmboard}:${POSTGRES_PASSWORD:-dev_postgres_password}@postgres:5432/${POSTGRES_DB:-calmboard_db}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-postgresql}
      - REDIS_URL=redis://redis:6379/0
      - CALMBOARD_QUEUE_NAME=${CALMBOARD_QUEUE_NAME:-calmboard-default}
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-calmboard-attachments}
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-dev_minio_user}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-dev_minio_password}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://localhost:4000}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:-development-auth-token-secret-change-in-production}
      - AUTH_GOOGLE_OAUTH_ENABLED=${AUTH_GOOGLE_OAUTH_ENABLED:-false}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - AUTH_MICROSOFT_OAUTH_ENABLED=${AUTH_MICROSOFT_OAUTH_ENABLED:-false}
      - MICROSOFT_OAUTH_CLIENT_ID=${MICROSOFT_OAUTH_CLIENT_ID:-}
      - MICROSOFT_OAUTH_CLIENT_SECRET=${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      - MICROSOFT_OAUTH_TENANT=${MICROSOFT_OAUTH_TENANT:-common}
      - WEBHOOK_SIGNING_SECRET=${WEBHOOK_SIGNING_SECRET:-development-webhook-secret-change-in-production}
      - INTEGRATION_CREDENTIALS_KEY=${INTEGRATION_CREDENTIALS_KEY:-}
      - INTEGRATION_CREDENTIALS_KEYS=${INTEGRATION_CREDENTIALS_KEYS:-}
      - INTEGRATION_CREDENTIALS_ACTIVE_KEY_VERSION=${INTEGRATION_CREDENTIALS_ACTIVE_KEY_VERSION:-1}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:-}
      - MFA_ENCRYPTION_KEYS=${MFA_ENCRYPTION_KEYS:-}
      - MFA_ENCRYPTION_ACTIVE_KEY_VERSION=${MFA_ENCRYPTION_ACTIVE_KEY_VERSION:-1}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_GRACE_PERIOD_DAYS=${STRIPE_GRACE_PERIOD_DAYS:-7}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      - SENTRY_PROFILES_SAMPLE_RATE=${SENTRY_PROFILES_SAMPLE_RATE:-0.1}
      - ENABLE_OTEL=${ENABLE_OTEL:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - METRICS_BEARER_TOKEN=${METRICS_BEARER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calmboard_net

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_MAINTENANCE_URL=postgresql://${POSTGRES_USER:-calmboard}:${POSTGRES_PASSWORD:-dev_postgres_password}@postgres:5432/${POSTGRES_DB:-calmboard_db}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-calmboard}:${POSTGRES_PASSWORD:-dev_postgres_password}@postgres:5432/${POSTGRES_DB:-calmboard_db}
      - REDIS_URL=redis://redis:6379/0
      - CALMBOARD_QUEUE_NAME=${CALMBOARD_QUEUE_NAME:-calmboard-default}
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-calmboard-attachments}
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-dev_minio_user}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-dev_minio_password}
      - ATTACHMENT_CLEANUP_INTERVAL_MS=${ATTACHMENT_CLEANUP_INTERVAL_MS:-900000}
      - ATTACHMENT_PENDING_RETENTION_HOURS=${ATTACHMENT_PENDING_RETENTION_HOURS:-2}
      - ATTACHMENT_DELETED_RETENTION_HOURS=${ATTACHMENT_DELETED_RETENTION_HOURS:-24}
      - ATTACHMENT_CLEANUP_BATCH_SIZE=${ATTACHMENT_CLEANUP_BATCH_SIZE:-100}
      - TASK_REMINDER_INTERVAL_MS=${TASK_REMINDER_INTERVAL_MS:-60000}
      - TASK_REMINDER_BATCH_SIZE=${TASK_REMINDER_BATCH_SIZE:-100}
      - NOTIFICATION_EMAIL_INTERVAL_MS=${NOTIFICATION_EMAIL_INTERVAL_MS:-30000}
      - NOTIFICATION_EMAIL_BATCH_SIZE=${NOTIFICATION_EMAIL_BATCH_SIZE:-50}
      - NOTIFICATION_EMAIL_CLAIM_TIMEOUT_MINUTES=${NOTIFICATION_EMAIL_CLAIM_TIMEOUT_MINUTES:-15}
      - AUTH_EMAIL_INTERVAL_MS=${AUTH_EMAIL_INTERVAL_MS:-15000}
      - AUTH_EMAIL_BATCH_SIZE=${AUTH_EMAIL_BATCH_SIZE:-25}
      - AUTH_EMAIL_CLAIM_TIMEOUT_MINUTES=${AUTH_EMAIL_CLAIM_TIMEOUT_MINUTES:-15}
      - AUTH_EMAIL_ENCRYPTION_KEY=${AUTH_EMAIL_ENCRYPTION_KEY:-}
      - AUTH_EMAIL_ENCRYPTION_KEYS=${AUTH_EMAIL_ENCRYPTION_KEYS:-}
      - AUTH_EMAIL_ENCRYPTION_ACTIVE_KEY_VERSION=${AUTH_EMAIL_ENCRYPTION_ACTIVE_KEY_VERSION:-1}
      - AUTOMATION_EVENT_INTERVAL_MS=${AUTOMATION_EVENT_INTERVAL_MS:-10000}
      - AUTOMATION_EVENT_BATCH_SIZE=${AUTOMATION_EVENT_BATCH_SIZE:-25}
      - AUTOMATION_EVENT_CLAIM_TIMEOUT_MINUTES=${AUTOMATION_EVENT_CLAIM_TIMEOUT_MINUTES:-15}
      - FORM_SUBMISSION_INTERVAL_MS=${FORM_SUBMISSION_INTERVAL_MS:-10000}
      - FORM_SUBMISSION_BATCH_SIZE=${FORM_SUBMISSION_BATCH_SIZE:-25}
      - FORM_SUBMISSION_CLAIM_TIMEOUT_MINUTES=${FORM_SUBMISSION_CLAIM_TIMEOUT_MINUTES:-15}
      - BILLING_GRACE_PERIOD_INTERVAL_MS=${BILLING_GRACE_PERIOD_INTERVAL_MS:-300000}
      - BILLING_GRACE_PERIOD_BATCH_SIZE=${BILLING_GRACE_PERIOD_BATCH_SIZE:-100}
      - WORKSPACE_EXPORT_INTERVAL_MS=${WORKSPACE_EXPORT_INTERVAL_MS:-10000}
      - WORKSPACE_EXPORT_BATCH_SIZE=${WORKSPACE_EXPORT_BATCH_SIZE:-5}
      - WORKSPACE_EXPORT_CLAIM_TIMEOUT_MINUTES=${WORKSPACE_EXPORT_CLAIM_TIMEOUT_MINUTES:-30}
      - WORKSPACE_EXPORT_RETENTION_DAYS=${WORKSPACE_EXPORT_RETENTION_DAYS:-7}
      - REPORT_SCHEDULE_INTERVAL_MS=${REPORT_SCHEDULE_INTERVAL_MS:-60000}
      - REPORT_SCHEDULE_BATCH_SIZE=${REPORT_SCHEDULE_BATCH_SIZE:-25}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-notifications@example.com}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      - SENTRY_PROFILES_SAMPLE_RATE=${SENTRY_PROFILES_SAMPLE_RATE:-0.1}
      - ENABLE_OTEL=${ENABLE_OTEL:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - METRICS_BEARER_TOKEN=${METRICS_BEARER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calmboard_net

  migrations:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-calmboard}:${POSTGRES_PASSWORD:-dev_postgres_password}@postgres:5432/${POSTGRES_DB:-calmboard_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - calmboard_net

  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calmboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-calmboard_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - calmboard_net

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - calmboard_net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev_minio_password}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calmboard_net

networks:
  calmboard_net:
    driver: bridge

volumes:
  pgdata18:
  redisdata:
  miniodata:
